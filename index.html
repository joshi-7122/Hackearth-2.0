<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>WIE HackEarth 2.0 · 2026 — Build. Break. Rebuild.</title>
    <meta
      name="description"
      content="WIE HackEarth 2.0 (2026): a pan-India hackathon by IEEE WIE, IEEE Galgotias University Student Branch and IEEE CIS. Prize pool up to ₹1,00,000. Register on Unstop by 16 Nov 2026; offline final on 29–30 Nov at Galgotias University, Greater Noida."
    />
    <meta name="theme-color" content="#fcf7eb" />
    <meta name="color-scheme" content="light dark" />
    <!-- Apply the saved / system theme before first paint (no flash) -->
    <script>
      (function () {
        var t = 'light';
        try {
          t = localStorage.getItem('he2-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        } catch (e) {}
        document.documentElement.dataset.theme = t;
        if (t === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#140a26');
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph — replace og:url with the live domain before launch -->
    <meta property="og:type" content="website" />
